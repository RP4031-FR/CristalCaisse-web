name: Joindre automatiquement le HTML aux Releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-html:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Joindre le HTML sous le nom standard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag invalide : $TAG (format attendu : vX.Y ou vX.Y.Z)"
            exit 1
          fi
          MAJOR_MINOR="$(echo "$VERSION" | cut -d. -f1-2)"
          SOURCE="CristalCaisse.$MAJOR_MINOR.html"
          if [[ ! -f "$SOURCE" ]]; then
            echo "::error::Fichier source introuvable : $SOURCE"
            exit 1
          fi
          gh release upload "$TAG" "$SOURCE#CristalCaisse.html" \
            --repo RP4031-FR/CristalCaisse-web \
            --clobber
